# Weekly on-chain catalog refresh for Explore.
# Pulls metadata + edition counts from collection contracts, commits JSON if changed,
# then deploys Explore. Force anytime via Actions → Run workflow.
#
# Required secrets (same as deploy-explore.yml):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

name: Sync Explore catalog

on:
  schedule:
    # Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-explore-catalog
  cancel-in-progress: false

jobs:
  sync:
    name: Scrape contracts + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync on-chain collections
        run: node scripts/sync-explore-collections.mjs
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

      - name: Commit catalog if changed
        run: |
          git config user.name "nikxart-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore/data/collections
          if git diff --cached --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(explore): weekly on-chain catalog sync"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      - name: Build explore
        run: npm run build:explore

      - name: Deploy Explore
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy explore/out --project-name=nikxart-explore --branch=main --commit-dirty=true
